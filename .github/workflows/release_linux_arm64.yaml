name: Release Linux ARM64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to'
        required: true
        type: string
  push:
    tags: ['arm64-*']

permissions:
  contents: read

env:
  TOOLCHAIN_HOST_NAME: linux-arm64
  CTNG_SOURCE_DIR: source-tarballs

jobs:
  pre-download:
    name: Pre-download
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Download tarballs
        run: |
          ./scripts/pre-download "$CTNG_SOURCE_DIR"
          ls -l "$CTNG_SOURCE_DIR"
      - name: Upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: source-tarballs
          path: ${{ env.CTNG_SOURCE_DIR }}
          retention-days: 1

  build-crosstool-ng:
    name: Build crosstool-NG
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build
        run: |
          ./scripts/make crosstool-ng
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: crosstool-ng
          path: "crosstool-ng.tar.xz"
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    needs: [pre-download, build-crosstool-ng]
    strategy:
      fail-fast: true
      matrix:
        target:
          - aarch64-w64-mingw32
          - i686-w64-mingw32
          - x86_64-w64-mingw32
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          name: source-tarballs
          path: ${{ env.CTNG_SOURCE_DIR }}
          merge-multiple: true
      - name: Download crosstool-NG
        uses: actions/download-artifact@v8
        with:
          name: crosstool-ng
      - name: Build
        run: |
          ls -l "$CTNG_SOURCE_DIR"
          ./scripts/make "${{ matrix.target }}"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TOOLCHAIN_HOST_NAME }}_${{ matrix.target }}
          path: "*_${{ matrix.target }}.tar.xz*"
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: "${{ env.TOOLCHAIN_HOST_NAME }}_*-*-*"
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == push ]; then
            tag=${GITHUB_REF#refs/tags/}
          else
            tag="${{ inputs.tag }}"
          fi
          if [ "$(gh release view "$tag" 2>&1)" == "release not found" ]; then
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes --draft
          fi
          hashfile="@${{ env.TOOLCHAIN_HOST_NAME }}-SHA256SUMS"
          rm -f "$hashfile"
          for name in release/*.tar.xz; do
            gh release upload "$tag" "$name"
            cat "${name}.sha256" >> "$hashfile"
          done
          gh release upload "$tag" "$hashfile"
